<ol class="move-steps" role="list">
  @for (each of steps(); track each.step) {
    <li class="move-steps__step">
      <span>{{ labels() + '.' + each.step | t }}</span>
      <app-status-tag
        [severity]="look(each.status).severity"
        [icon]="look(each.status).icon"
        [label]="'redeploy.status.' + each.status | t"
      />
    </li>
  }
</ol>
