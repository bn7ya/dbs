<form class="dialog-form" (ngSubmit)="submit()">
  <p class="text-secondary">{{ 'files.newFolder.location' | t: { path: where } }}</p>

  @if (otherFailure(); as failure) {
    <p-message severity="error">{{ failure | errorText }}</p-message>
  }

  <app-field
    [label]="'files.newFolder.name' | t"
    [error]="problem() !== null ? ('files.newFolder.invalid.' + problem() | t) : (nameFailure() | errorText)"
  >
    <input
      pInputText
      appFieldControl
      fluid
      type="text"
      name="name"
      dir="auto"
      autocomplete="off"
      spellcheck="false"
      maxlength="255"
      [invalid]="problem() !== null || nameFailure() !== null"
      [ngModel]="name()"
      (ngModelChange)="onName($event)"
    />
  </app-field>

  <div class="dialog-actions">
    <button pButton type="button" severity="secondary" variant="text" (click)="cancel()">{{ 'actions.cancel' | t }}</button>
    <button pButton type="submit" [disabled]="busy()" [attr.aria-busy]="busy()">
      @if (busy()) {
        <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
      }
      {{ 'files.newFolder.submit' | t }}
    </button>
  </div>
</form>
