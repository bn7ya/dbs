@if (backingUp()) {
  <app-notice severity="info">{{ 'backups.take.running' | t }}</app-notice>
}

@if (liveConnection(); as connection) {
  <app-job-connection [connection]="connection" />
}

@if (deleted(); as file) {
  <app-notice severity="success" closable (closed)="dismissDeleted()">
    <span class="backup-notices__deleted">
      <span><span>{{ 'backups.delete.done' | t }}</span> <bdi class="backup-notices__code" dir="ltr">{{ file.name }}</bdi></span>
      <button matButton type="button" [disabled]="undoing()" [attr.aria-busy]="undoing()" (click)="undoDelete()">
        @if (undoing()) {
          <i matButtonIcon class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
        }
        {{ 'backups.delete.undo' | t }}
      </button>
    </span>
  </app-notice>
}
