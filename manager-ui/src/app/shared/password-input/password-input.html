<mat-form-field class="password-input">
  <mat-label>{{ label() }}</mat-label>
  <input
    matInput
    [appFieldError]="error()"
    [type]="masked() ? 'password' : 'text'"
    [attr.name]="name() || null"
    [attr.autocomplete]="autocomplete()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [value]="value()"
    (input)="input($event)"
    (blur)="touch()"
  />
  <button
    matIconButton
    matSuffix
    type="button"
    [attr.aria-label]="toggleLabel()"
    [attr.aria-pressed]="!masked()"
    [disabled]="disabled()"
    (click)="toggle()"
  >
    <i class="fa-solid" [class.fa-eye]="masked()" [class.fa-eye-slash]="!masked()" aria-hidden="true"></i>
  </button>
  @if (hint() !== '') {
    <mat-hint>{{ hint() }}</mat-hint>
  }
  @if (error()) {
    <mat-error>{{ error() }}</mat-error>
  }
</mat-form-field>
