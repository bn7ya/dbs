<div class="password-input">
  <input
    pInputPassword
    fluid
    [mask]="masked()"
    [attr.id]="field?.id ?? null"
    [attr.name]="name() || null"
    [attr.aria-describedby]="field?.describedBy() ?? null"
    [attr.aria-invalid]="field?.invalid() ? 'true' : null"
    [attr.autocomplete]="autocomplete()"
    [attr.placeholder]="placeholder() || null"
    [disabled]="disabled()"
    [value]="value()"
    (input)="input($event)"
    (blur)="touch()"
  />
  <button
    pButton
    type="button"
    variant="text"
    severity="secondary"
    iconOnly
    class="password-input__toggle"
    [attr.aria-label]="toggleLabel()"
    [attr.aria-pressed]="!masked()"
    [disabled]="disabled()"
    (click)="toggle()"
  >
    <i class="fa-solid" [class.fa-eye]="masked()" [class.fa-eye-slash]="!masked()" aria-hidden="true"></i>
  </button>
</div>
