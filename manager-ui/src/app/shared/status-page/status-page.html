@if (framed) {
  <div class="status-page">
    <ng-container [ngTemplateOutlet]="card" />
  </div>
} @else {
  <main id="main" class="status-page status-page--alone">
    <ng-container [ngTemplateOutlet]="card" />
  </main>
}

<ng-template #card>
  <p-card class="status-page__card">
    <div class="status-page__content">
      <h1>{{ titleKey() | t }}</h1>
      <p class="text-secondary">{{ bodyKey() | t }}</p>
      <a pButton variant="text" routerLink="/">{{ 'errors.goHome' | t }}</a>
    </div>
  </p-card>
</ng-template>
