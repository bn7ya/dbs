<form class="dialog-form" (ngSubmit)="submit()">
  <p class="text-secondary">{{ data.bodyKey | t }}</p>

  @if (otherFailure(); as failure) {
    <p-message severity="error">{{ failure | errorText }}</p-message>
  }

  <app-field
    [label]="'password.label' | t"
    [error]="missing() ? ('password.required' | t) : rejected() ? ('invalid_password' | errorText) : ''"
  >
    <app-password-input
      name="password"
      [ngModel]="password()"
      (ngModelChange)="password.set($event)"
    />
  </app-field>

  <div class="dialog-actions">
    <button pButton type="button" severity="secondary" variant="text" (click)="cancel()">{{ 'actions.cancel' | t }}</button>
    <button pButton type="submit" [disabled]="busy()" [attr.aria-busy]="busy()">
      @if (busy()) {
        <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
      }
      {{ data.submitKey | t }}
    </button>
  </div>
</form>
