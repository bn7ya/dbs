<form class="dialog-form" (ngSubmit)="submit()">
  <p class="text-secondary">{{ data.bodyKey | t }}</p>

  @if (otherFailure(); as failure) {
    <app-notice severity="danger">{{ failure | errorText }}</app-notice>
  }

  <app-password-input
    [label]="'password.label' | t"
    [error]="missing() ? ('password.required' | t) : rejected() ? ('invalid_password' | errorText) : ''"
    name="password"
    [ngModel]="password()"
    (ngModelChange)="password.set($event)"
  />

  <div class="dialog-actions">
    <button matButton type="button" (click)="cancel()">{{ 'actions.cancel' | t }}</button>
    <button matButton="filled" type="submit" [disabled]="busy()" [attr.aria-busy]="busy()">
      @if (busy()) {
        <i matButtonIcon class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
      }
      {{ data.submitKey | t }}
    </button>
  </div>
</form>
