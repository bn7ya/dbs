<form class="change-password" novalidate (ngSubmit)="submit()">
  @if (otherFailure(); as failure) {
    <app-notice severity="danger">{{ failure | errorText }}</app-notice>
  }

  <app-password-input
    [label]="'auth.changePassword.current' | t"
    [error]="currentError()"
    name="current-password"
    autocomplete="current-password"
    [ngModel]="current()"
    (ngModelChange)="current.set($event)"
  />

  <app-password-input
    [label]="'auth.changePassword.new' | t"
    [hint]="'auth.changePassword.newHint' | t"
    [error]="freshError()"
    name="new-password"
    autocomplete="new-password"
    [ngModel]="fresh()"
    (ngModelChange)="fresh.set($event)"
  />

  <app-password-input
    [label]="'auth.changePassword.confirm' | t"
    [error]="confirmError()"
    name="confirm-password"
    autocomplete="new-password"
    [ngModel]="confirm()"
    (ngModelChange)="confirm.set($event)"
  />

  <div>
    <button matButton="filled" type="submit" [disabled]="busy()" [attr.aria-busy]="busy()">
      @if (busy()) {
        <i matButtonIcon class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
      }
      {{ (busy() ? 'auth.changePassword.working' : 'auth.changePassword.submit') | t }}
    </button>
  </div>
</form>
