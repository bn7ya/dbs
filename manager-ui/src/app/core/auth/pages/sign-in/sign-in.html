<main id="main" class="sign-in">
  <mat-card appearance="outlined" class="sign-in__card">
    <mat-card-content class="sign-in__content">
      <header class="sign-in__header">
        <h1>{{ 'auth.signIn.title' | t }}</h1>
        <p class="text-secondary">{{ 'auth.signIn.subtitle' | t }}</p>
      </header>

      @if (error(); as failure) {
        <app-notice severity="danger">{{ failure | errorText }}</app-notice>
      }

      <form class="sign-in__form" novalidate (ngSubmit)="submit()">
        <mat-form-field>
          <mat-label>{{ 'auth.signIn.username' | t }}</mat-label>
          <input
            matInput
            name="username"
            autocomplete="username"
            dir="auto"
            [appFieldError]="usernameInvalid() ? ('auth.errors.usernameRequired' | t) : ''"
            [placeholder]="'auth.signIn.usernamePlaceholder' | t"
            [ngModel]="username()"
            (ngModelChange)="username.set($event)"
          />
          @if (usernameInvalid()) {
            <mat-error>{{ 'auth.errors.usernameRequired' | t }}</mat-error>
          }
        </mat-form-field>

        <app-password-input
          [label]="'auth.signIn.password' | t"
          [error]="passwordInvalid() ? ('auth.errors.passwordRequired' | t) : ''"
          name="password"
          [placeholder]="'auth.signIn.passwordPlaceholder' | t"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
        />

        <button matButton="filled" class="sign-in__submit" type="submit" [disabled]="busy()" [attr.aria-busy]="busy()">
          @if (busy()) {
            <i matButtonIcon class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
          }
          {{ (busy() ? 'auth.signIn.working' : 'auth.signIn.submit') | t }}
        </button>
      </form>

      <footer>
        <app-locale-switcher />
      </footer>
    </mat-card-content>
  </mat-card>
</main>
