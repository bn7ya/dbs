<main id="main" class="password">
  <mat-card appearance="outlined" class="password__card">
    <mat-card-content class="password__content">
      <header class="password__header">
        <app-brand-mark size="large" decorative />
        <h1>{{ 'auth.changePassword.title' | t }}</h1>
        @if (user(); as signedIn) {
          <p class="text-secondary">
            {{ 'auth.changePassword.required' | t: { date: (signedIn.password_expires_at | appDate) } }}
          </p>
        }
      </header>

      <app-change-password-form (changed)="changed()" />

      <footer class="password__footer">
        <button matButton type="button" [disabled]="signingOut()" (click)="signOut()">
          <i matButtonIcon class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
          {{ 'auth.signOut' | t }}
        </button>
        <app-locale-switcher />
      </footer>
    </mat-card-content>
  </mat-card>
</main>
