blank_issues_enabled: false
contact_links:
  - name: Report a security problem
    url: https://github.com/bn7ya/dbs/security/advisories/new
    about: Privately, never in a public issue. SECURITY.md says what to include and what happens next.
  - name: Ask a question
    url: https://github.com/bn7ya/dbs/discussions/categories/q-a
    about: How to set DBS up, back up, restore or run the manager.
  - name: Share an idea
    url: https://github.com/bn7ya/dbs/discussions/categories/ideas
    about: An idea still taking shape. A proposal ready to build is an enhancement issue.
  - name: Read the documentation
    url: https://github.com/bn7ya/dbs/tree/main/docs
    about: The guides, the command and settings reference, and troubleshooting.
