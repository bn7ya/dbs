[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-dbs"
version = "0.6.0"
description = "Redundant, self-healing, encrypted single-file backup for Django projects."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "bn7ya" }]
keywords = ["django", "backup", "restore", "encryption", "reed-solomon", "redundancy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Systems Administration",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "Django>=4.2,<7",
    "cryptography>=41,<51",
    "argon2-cffi>=21.3,<26",
    "reedsolo>=1.7,<2",
]

[project.optional-dependencies]
guard = ["scikit-learn>=1.3,<2"]
ssh = ["paramiko>=3,<6"]
manager = [
    "djangorestframework>=3.15,<4",
    "waitress>=3,<4",
    "paramiko>=3,<6",
    "tomli>=1.1.0,<3; python_version < '3.11'",
]
all = ["django-dbs[guard,manager,ssh]"]
dev = [
    "django-dbs[all]",
    "pytest>=7,<10",
    "pytest-django>=4,<5",
    "pytest-cov>=4,<8",
    "ruff>=0.4,<1",
]

[project.scripts]
dbs-client = "dbs.client.cli:main"
django_dbs = "dbs.manager.cli:main"

[project.urls]
Homepage = "https://github.com/bn7ya/dbs"
Repository = "https://github.com/bn7ya/dbs"
Issues = "https://github.com/bn7ya/dbs/issues"
Changelog = "https://github.com/bn7ya/dbs/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["dbs*"]

[tool.setuptools.package-data]
dbs = [
    "ai/*.md",
    "ai/*.txt",
    "ai/reference/*.md",
    "security/baseline.json.gz",
    "static/dbs/*",
    "templates/admin/dbs/*.html",
    "templates/admin/dbs/wiki/*.html",
    "manager/static/dbs_manager/**/*",
    "manager/templates/dbs_manager/*.html",
]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
