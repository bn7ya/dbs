[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "django-dbs"
version = "0.2.0"
description = "Redundant, self-healing, encrypted single-file backup for Django projects."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "bn7ya" }]
keywords = ["django", "backup", "restore", "encryption", "reed-solomon", "redundancy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Systems Administration",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "Django>=4.2,<6",
    "cryptography>=41",
    "argon2-cffi>=21.3",
    "reedsolo>=1.7",
]

[project.optional-dependencies]
ssh = ["paramiko>=3"]
client = ["paramiko>=3", "tomli>=1.1.0; python_version < '3.11'"]
dev = [
    "pytest>=7",
    "pytest-django>=4",
    "pytest-cov>=4",
    "ruff>=0.4",
    "paramiko>=3",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.scripts]
dbs-client = "dbs.client.cli:main"

[project.urls]
Homepage = "https://github.com/bn7ya/dbs"
Repository = "https://github.com/bn7ya/dbs"
Issues = "https://github.com/bn7ya/dbs/issues"
Changelog = "https://github.com/bn7ya/dbs/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["dbs*"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
